name: Deploy to VPS

on:
  push:
    branches:
      - dev/first

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" | base64 -d > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy via SSH
        run: |
          ssh -i ~/.ssh/deploy_key ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} "
            cd ~/SekaiTalk &&
            git pull origin dev/first &&
            npm ci --omit=dev &&
            npx prisma generate &&
            npm run build &&
            pm2 restart sekaitalk
          "
